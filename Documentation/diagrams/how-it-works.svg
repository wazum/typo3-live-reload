<text x="544" y="156" fill="#5B6570" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" letter-spacing="0.04em">CACHE TAGS</text>

<path d="M352,320 V364 Q352,372 344,372 H160 Q152,372 152,380 V424" fill="none" stroke="#1A1E24" stroke-width="2" marker-end="url(#hiw-t-arrow-ink)"/>
