<?xml version="1.0" encoding="UTF-8"?>
<svg width="880" height="584" viewBox="0 0 880 584" role="img" aria-labelledby="hiw-tablet-title hiw-tablet-desc" xmlns="http://www.w3.org/2000/svg">
<title id="hiw-tablet-title">How a change reaches the right tabs</title>
<desc id="hiw-tablet-desc">A partial saved in the code editor becomes a file tag, and a record saved in the TYPO3 backend becomes cache tags. The Vite dev server or the poll endpoint sends these tags to every open tab. The tab that rendered the partial and the tab that shows the record reload, and a third tab without a matching tag stays as it is.</desc>

<defs>
    <marker id="hiw-t-arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#5B6570"/>
    </marker>
    <marker id="hiw-t-arrow-ink" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#1A1E24"/>
    </marker>
</defs>

<rect width="100%" height="100%" fill="#FFFFFF"/>

<rect x="8" y="392" width="864" height="168" rx="8" fill="rgba(26,30,36,0.02)" stroke="rgba(26,30,36,0.28)" stroke-width="1" stroke-dasharray="6,5"/>
<text x="440" y="544" fill="rgba(26,30,36,0.62)" font-size="12" font-family="'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace" text-anchor="middle" letter-spacing="0.14em">EACH OPEN TAB COMPARES THE TAGS WITH ITS OWN</text>

