* { box-sizing:border-box; }

main { max-width:960px; margin:0 auto; }

.sub { margin:0 0 16px; font-size:15px; line-height:1.6; color:var(--muted); max-width:64ch; }
svg { display:block; width:100%; height:auto; }
/* Container query, not viewport: a wide window can still hand the diagram a narrow column. */
.figure { container-type:inline-size; }
.tablet { max-width:880px; margin:0 auto; }
.narrow { display:none; max-width:344px; margin:0 auto; }
@container (max-width: 699px) {
    .tablet { display:none; }
    .narrow { display:block; }
}
@media (max-width: 1099px) { body { padding:32px 20px; } }
footer {
    margin-top:16px; padding-top:12px; border-top:1px solid var(--rule);
    font-family:'Source Code Pro',ui-monospace,SFMono-Regular,Menlo,monospace;

<main>
    <p class="eyebrow">TYPO3 Live Reload</p>
    <h1>How a change reaches the right tabs</h1>
    <p class="sub">A saved file or record becomes tags. The tags go to every open tab, and each tab compares them with the tags of its own page. Only a tab with a matching tag reloads.</p>

<title id="hiw-tablet-title">How a change reaches the right tabs</title>
<desc id="hiw-tablet-desc">A partial saved in the code editor becomes a file tag, and a record saved in the TYPO3 backend becomes cache tags. The Vite dev server or the poll endpoint sends these tags to every open tab. The tab that rendered the partial and the tab that shows the record reload, and a third tab without a matching tag stays as it is.</desc>
